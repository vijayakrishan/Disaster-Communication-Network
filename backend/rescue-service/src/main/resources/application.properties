# =====================================================
# APPLICATION
# =====================================================

spring.application.name=rescue-service
server.port=8086
server.address=0.0.0.0


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rescue_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =====================================================
# AUTH SERVICE
# =====================================================

auth.service.url=http://localhost:8081


# =====================================================
# CORS
# =====================================================

spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5178,http://localhost:5180

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*