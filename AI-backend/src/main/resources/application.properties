# ==============================================================================
# RESQMESH AI Standalone Backend Configuration
# ==============================================================================
spring.application.name=resqmesh-ai-backend
server.port=8086

# AI Model Configuration
resqmesh.ai.model-path=classpath:model/resqmesh_final_validated_model.json
resqmesh.ai.features-path=classpath:model/resqmesh_final_validated_features.json
resqmesh.ai.threshold-path=classpath:model/resqmesh_final_validated_threshold.json
resqmesh.ai.model-version=resqmesh-final-validated

# Operational Demonstration Risk Thresholds
# Note: Validated decision threshold from research artifact is 0.50 (Frozen binary threshold).
# Operational categorizations are configured below for triage demonstration:
resqmesh.ai.thresholds.safe-max=0.35
resqmesh.ai.thresholds.warning-max=0.50

# Logging
logging.level.com.resqmesh.ai=INFO
logging.level.org.springframework.web=INFO
